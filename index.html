<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <title>Neon Trail — Endless Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <main class="page-shell">
    <header class="brand">
      <div class="brand-mark">✦</div>
      <div><p class="eyebrow">ARCADE RUNNER</p><h1>Bhaag<span>Billa</span></h1></div>
    </header>

    <section class="game-wrap" aria-label="Endless runner game">
      <div class="game" id="game">
        <div class="scene-sky"></div>
        <div class="sun-glow"></div>
        <div class="mountain mountain-back"></div>
        <div class="mountain mountain-front"></div>
        <div class="side-foliage foliage-left"></div>
        <div class="side-foliage foliage-right"></div>
        <div id="scene">
          <div id="road"></div>
          <div class="road-edge road-edge-left"></div>
          <div class="road-edge road-edge-right"></div>
          <div id="runner-shadow"></div>
          <div id="runner" aria-label="Running orange cat"></div>
        </div>

        <div class="hud">
          <div class="hud-stat"><span class="hud-label">LEVEL</span><strong id="level">1</strong></div>
          <div class="hud-score"><span class="hud-label">SCORE</span><strong id="score">0</strong></div>
          <button class="icon-button pause-button" id="pause-button" aria-label="Pause game" title="Pause">Ⅱ</button>
        </div>

        <div class="progress-track"><div id="progress-bar"></div></div>

        <div class="overlay" id="start-screen">
          <div class="modal-card">
            <div class="cat-emoji">🐱</div>
            <p class="eyebrow">READY, RUNNER?</p>
            <h2>THE TRAIL<br><span>IS YOURS.</span></h2>
            <p class="modal-copy">Dodge the bombs, collect the gold and see how far you can run.</p>
            <button class="primary-button" id="start-button">START RUN</button>
          </div>
        </div>

        <div class="overlay hidden" id="pause-screen">
          <div class="modal-card compact-card">
            <p class="eyebrow">TAKE A BREATHER</p><h2>PAUSED</h2>
            <button class="primary-button" id="resume-button">RESUME</button>
          </div>
        </div>

        <div class="overlay hidden" id="game-over-screen">
          <div class="modal-card compact-card">
            <p class="eyebrow">RUN COMPLETE</p><h2>GAME OVER</h2>
            <div class="result-row"><div><span class="hud-label">YOUR SCORE</span><strong id="final-score">0</strong></div><div><span class="hud-label">BEST SCORE</span><strong id="best-score">0</strong></div></div>
            <button class="primary-button" id="restart-button">RUN AGAIN</button>
          </div>
        </div>
      </div>

    </section>
    <footer class="footer-note"><span class="status-dot"></span> BUILT TO RUN FOREVER <span class="footer-divider">•</span> KEYBOARD + TOUCH READY</footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
